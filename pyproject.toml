[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "auto-oncall"
version = "0.1.0"
description = "Event-driven incident triage and root-cause-analysis engine"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "celery[redis]>=5.3",
    "redis>=5.0",
    "PyGithub>=2.3",
    "slack-sdk>=3.27",
    "anthropic>=2.14",
    "chromadb>=1.0",
    "structlog>=24.1",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8", "fakeredis>=2.23", "ruff>=0.6"]

[tool.setuptools.packages.find]
include = ["app*", "auto_oncall_client*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [".venv"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B"]
ignore = ["E501"]  # the formatter owns line length; long strings stay readable
