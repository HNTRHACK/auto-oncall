# Create the Slack app in one step: https://api.slack.com/apps -> Create New App ->
# From an app manifest -> pick your workspace -> paste this file.
# Replace YOUR-HOST with the public HTTPS address of the Auto-OnCall API.
display_information:
  name: Auto-OnCall
  description: Crash triage with root-cause analysis and one-click hotfix PRs
  background_color: "#b91c1c"
features:
  bot_user:
    display_name: Auto-OnCall
    always_online: true
oauth_config:
  scopes:
    bot:
      - chat:write
settings:
  interactivity:
    is_enabled: true
    request_url: https://YOUR-HOST/slack/actions
  org_deploy_enabled: false
  socket_mode_enabled: false
  token_rotation_enabled: false
